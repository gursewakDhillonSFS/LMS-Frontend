<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Base Skullcap Gradient -->
    <linearGradient id="fav-skullcap" x1="14" y1="24" x2="50" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#4F46E5" />
      <stop offset="60%" stopColor="#2563EB" />
      <stop offset="100%" stopColor="#1D4ED8" />
    </linearGradient>

    <!-- Diamond Mortarboard Gradient -->
    <linearGradient id="fav-mortarboard" x1="6" y1="8" x2="58" y2="34" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#1E293B" />
      <stop offset="60%" stopColor="#0F172A" />
      <stop offset="100%" stopColor="#0B132B" />
    </linearGradient>

    <!-- 3D Bevel Rim -->
    <linearGradient id="fav-rim" x1="6" y1="20" x2="58" y2="36" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#38BDF8" />
      <stop offset="50%" stopColor="#818CF8" />
      <stop offset="100%" stopColor="#4F46E5" />
    </linearGradient>
  </defs>

  <!-- Skullcap Base -->
  <path
    d="M16 26 V32 C16 38 23 45 32 47 C41 45 48 38 48 32 V26 L32 34.5 L16 26 Z"
    fill="url(#fav-skullcap)"
  />

  <!-- 3D Rim / Edge Under Mortarboard -->
  <path
    d="M6 20.5 L32 34.5 L58 20.5 L58 23.5 L32 37.5 L6 23.5 Z"
    fill="url(#fav-rim)"
  />

  <!-- Mortarboard Diamond Top -->
  <path
    d="M32 7.5 L58 20.5 L32 34.5 L6 20.5 Z"
    fill="url(#fav-mortarboard)"
    stroke="#60A5FA"
    stroke-width="1"
    stroke-linejoin="round"
  />

  <!-- Mortarboard Center Button -->
  <ellipse cx="32" cy="20.5" rx="2.5" ry="1.5" fill="#38BDF8" />

  <!-- Tassel Cord: Drape from center across to right corner and hang down -->
  <path
    d="M32 20.5 Q44 21.5 51 24.5 V38"
    fill="none"
    stroke="#38BDF8"
    stroke-width="2.5"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Tassel Bead & Fringe -->
  <circle cx="51" cy="39" r="2.5" fill="#60A5FA" />
  <path
    d="M48.5 40.5 L53.5 40.5 L54.5 46.5 L47.5 46.5 Z"
    fill="#38BDF8"
  />
</svg>