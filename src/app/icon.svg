<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Light Mode Gradients -->
    <linearGradient id="sc-light" x1="14" y1="24" x2="50" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="60%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
    <linearGradient id="mb-light" x1="6" y1="8" x2="58" y2="34" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="60%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Dark Mode Gradients -->
    <linearGradient id="sc-dark" x1="14" y1="24" x2="50" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7C3AED" />
      <stop offset="50%" stop-color="#4F46E5" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>
    <linearGradient id="mb-dark" x1="6" y1="8" x2="58" y2="34" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="60%" stop-color="#F8FAFC" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>

    <!-- 3D Rim Gradient -->
    <linearGradient id="rim-grad" x1="6" y1="20" x2="58" y2="36" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#4F46E5" />
    </linearGradient>
  </defs>

  <style>
    /* Default (Light Mode) */
    .mortar-top {
      fill: url(#mb-light);
      stroke: #38BDF8;
      stroke-width: 2.5;
    }
    .skullcap-base {
      fill: url(#sc-light);
    }
    .rim-edge {
      fill: url(#rim-grad);
    }
    .center-button {
      fill: #38BDF8;
    }
    .tassel-cord {
      stroke: #38BDF8;
    }
    .tassel-bead {
      fill: #60A5FA;
    }
    .tassel-fringe {
      fill: #38BDF8;
    }

    /* Dark Mode: Automatically adapts in dark browser tabs & OS dark mode */
    @media (prefers-color-scheme: dark) {
      .mortar-top {
        fill: url(#mb-dark);
        stroke: #38BDF8;
        stroke-width: 2.5;
      }
      .skullcap-base {
        fill: url(#sc-dark);
      }
      .center-button {
        fill: #2563EB;
      }
      .tassel-cord {
        stroke: #38BDF8;
      }
      .tassel-bead {
        fill: #60A5FA;
      }
      .tassel-fringe {
        fill: #38BDF8;
      }
    }
  </style>

  <!-- Skullcap Base -->
  <path
    class="skullcap-base"
    d="M16 26 V32 C16 38 23 45 32 47 C41 45 48 38 48 32 V26 L32 34.5 L16 26 Z"
  />

  <!-- 3D Rim / Edge Under Mortarboard -->
  <path
    class="rim-edge"
    d="M6 20.5 L32 34.5 L58 20.5 L58 23.5 L32 37.5 L6 23.5 Z"
  />

  <!-- Mortarboard Diamond Top -->
  <path
    class="mortar-top"
    d="M32 7.5 L58 20.5 L32 34.5 L6 20.5 Z"
    stroke-linejoin="round"
  />

  <!-- Mortarboard Center Button -->
  <ellipse class="center-button" cx="32" cy="20.5" rx="2.5" ry="1.5" />

  <!-- Tassel Cord -->
  <path
    class="tassel-cord"
    d="M32 20.5 Q44 21.5 51 24.5 V38"
    fill="none"
    stroke-width="2.5"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Tassel Bead & Fringe -->
  <circle class="tassel-bead" cx="51" cy="39" r="2.5" />
  <path
    class="tassel-fringe"
    d="M48.5 40.5 L53.5 40.5 L54.5 46.5 L47.5 46.5 Z"
  />
</svg>
